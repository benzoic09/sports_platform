<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Sports Ticketing Platform{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >
</head>
<body class="d-flex flex-column min-vh-100">

<nav class="navbar navbar-expand navbar-dark bg-dark">
    <div class="container">

        <!-- Website Logo / Name -->
        <a class="navbar-brand" href="/">SportsHub</a>

        <!-- Page links -->
        <ul class="navbar-nav me-auto">
            <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="/sports/">Sports</a></li>
        </ul>

        <!-- Login / user area -->
        <div class="d-flex align-items-center">

            {% if user.is_authenticated %}

                <span class="text-white me-3">{{ user.username }}</span>
                <a class="btn btn-outline-light btn-sm" href="/accounts/logout/">Logout</a>

            {% else %}

                <a class="btn btn-outline-light btn-sm me-2" href="/accounts/login/">Login</a>
                <a class="btn btn-primary btn-sm" href="/accounts/register/">Register</a>

            {% endif %}

        </div>
    </div>
</nav>

<!-- Page content -->
<div class="container mt-4 flex-grow-1">

    {% if messages %}
        {% for message in messages %}
            <div class="alert alert-info">{{ message }}</div>
        {% endfor %}
    {% endif %}

    {% block content %}
    {% endblock %}

</div>

<footer class="bg-dark text-white-50 py-3 mt-5">
    <div class="container d-flex justify-content-between">
        <small>&copy; 2026 SportsHub</small>
        <small>Pay securely with M-Pesa</small>
    </div>
</footer>

</body>
</html>
